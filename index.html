<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4ed">
  <title>Ruang QR — Generator tautan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Ruang QR">
        <span class="brand-mark" aria-hidden="true">qr/</span>
        <span>ruang QR</span>
      </a>
      <span class="live-label"><span class="live-dot" aria-hidden="true"></span>Live generator</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Alat tautan / 001</p>
        <h1 id="page-title">Satu tautan,<br><span>satu QR.</span></h1>
      </section>

      <section class="workbench" aria-label="Generator QR">
        <div class="form-panel">
          <label class="field-label" for="url-input">
            <span>Tautan tujuan</span>
            <span class="counter" id="counter">0 / 2048</span>
          </label>
          <input
            class="url-input"
            id="url-input"
            type="text"
            inputmode="url"
            autocomplete="url"
            maxlength="2048"
            placeholder="https://contoh.com/halaman"
            aria-describedby="field-note"
            aria-invalid="false"
          >
          <p class="field-note" id="field-note">QR dan tautannya berlaku selama 120 menit.</p>
          <div class="actions">
            <button class="button button-primary" id="download-button" type="button" disabled>
              <span aria-hidden="true">↓</span> Unduh PNG
            </button>
            <button class="button button-secondary" id="copy-button" type="button" disabled>
              <span aria-hidden="true">↗</span> Salin tautan tujuan
            </button>
          </div>
        </div>

        <aside class="preview" aria-label="Pratinjau kode QR">
          <div class="preview-head">
            <span>Pratinjau</span>
            <span class="preview-counter">PNG / 256px</span>
          </div>
          <div class="qr-stage">
            <div class="qr-placeholder" id="qr-placeholder" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="qr-code" id="qr-code" hidden></div>
          </div>
          <p class="preview-status" id="preview-status" aria-live="polite" aria-atomic="true">
            <span id="preview-status-message">Menunggu tautan</span>
            <span class="preview-countdown" id="preview-countdown" hidden>
              <span class="preview-countdown-label">Sisa waktu</span>
              <time id="countdown-value">02:00:00</time>
            </span>
          </p>
        </aside>
      </section>
    </main>

    <footer>
      <span>RUANG QR <span class="footer-mark">/</span> 2026</span>
      <span>Token QR aktif selama 120 menit</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
