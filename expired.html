<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4ed">
  <title>Link kedaluwarsa — Ruang QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="expired.css">
</head>
<body>
  <div class="shell expired-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Ruang QR">
        <span class="brand-mark" aria-hidden="true">qr/</span>
        <span>ruang QR</span>
      </a>
      <span class="live-label"><span class="expired-dot" aria-hidden="true"></span>QR tidak aktif</span>
    </header>

    <main class="expired-main">
      <p class="eyebrow">Tautan / 410</p>
      <div class="expired-stamp" aria-hidden="true"><span>20</span><small>DETIK</small></div>
      <h1>Link sudah<br><span>kedaluwarsa.</span></h1>
      <p class="expired-copy">QR ini hanya berlaku selama 20 detik. Minta pemilik tautan untuk menampilkan QR terbaru.</p>
      <a class="button button-primary expired-return" href="./">Kembali ke generator <span aria-hidden="true">↗</span></a>
    </main>

    <footer>
      <span>RUANG QR <span class="footer-mark">/</span> 2026</span>
      <span>Link sementara, lebih terjaga</span>
    </footer>
  </div>
</body>
</html>
